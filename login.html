<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie | Panel Mistrza</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width: 400px; padding-top: 60px;">
        <h1 class="section-title" style="font-size:30px;">PANEL MISTRZA</h1>
        <form class="review-form" id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required value
            <div class="form-group">
                <label>Hasło</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-outline" style="width:100%;">ZALOGUJ SIĘ</button>
            <p id="errorMsg" style="color:red; text-align:center; margin-top:10px; font-size:13px;"></p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();
            if (data.success) {
                localStorage.setItem('token', data.token);
                window.location.href = 'admin.html';
            } else {
                document.getElementById('errorMsg').innerText = data.message;
            }
        });
    </script>
</body>
</html>
